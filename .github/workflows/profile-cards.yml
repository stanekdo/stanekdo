name: Update profile cards

on:
  push:
    branches: ["main"]
    paths:
      - README.md
      - .github/workflows/profile-cards.yml
      - scripts/**
      - assets/trophy-art.json
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refresh public and private profile statistics
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          PROFILE_CONTRIBUTIONS_TOKEN: ${{ secrets.PROFILE_CONTRIBUTIONS_TOKEN }}
        run: python3 -m scripts.fetch_profile --username "$GITHUB_REPOSITORY_OWNER"

      - name: Render profile
        run: python3 -m scripts.render_profile

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update cached profile assets"
          git push
